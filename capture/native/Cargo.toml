[package]
name = "wayd_net"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ipstack = { version = "=1.0.1", default-features = false }
jni = "=0.22.4"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
libc = "0.2"

# TLS interception (research flavor only): compiled in with `--features mitm`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"], optional = true }
time = { version = "0.3", optional = true }
httparse = { version = "1", optional = true }
webpki-roots = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
md-5 = { version = "0.10", optional = true }

[features]
default = []
mitm = ["dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:time", "dep:httparse", "dep:webpki-roots", "dep:rustls-pemfile", "dep:md-5"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
