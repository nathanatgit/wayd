[package]
name = "wayd_net"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ipstack = { version = "=1.0.1", default-features = false }
jni = "=0.22.4"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
