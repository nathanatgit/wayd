name: Release

# Pushing a tag like v0.1.1 builds the signed core and clash release APKs and publishes them as a GitHub release.
# The tag must match versionName in app/build.gradle.kts (v0.1.1 <-> "0.1.1").
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match versionName
        run: |
          VER="${GITHUB_REF_NAME#v}"
          GRADLE_VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$VER" != "$GRADLE_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $GRADLE_VER in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v5
        with:
          go-version-file: routing/go.mod

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust tests
        working-directory: capture/native
        run: cargo test --features mitm

      - name: Unit tests
        run: ./gradlew test -PskipNative

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.WAYD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret WAYD_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wayd-release.p12"
          echo "WAYD_KEYSTORE_FILE=$RUNNER_TEMP/wayd-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          WAYD_KEYSTORE_PASSWORD: ${{ secrets.WAYD_KEYSTORE_PASSWORD }}
          WAYD_KEY_ALIAS: ${{ secrets.WAYD_KEY_ALIAS }}
          WAYD_KEY_PASSWORD: ${{ secrets.WAYD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleCoreRelease :app:assembleClashRelease

      - name: Verify and name the APKs
        run: |
          APK="wayd-v${VERSION}.apk"
          APK_CLASH="wayd-clash-v${VERSION}.apk"
          cp app/build/outputs/apk/core/release/app-core-release.apk "$APK"
          cp app/build/outputs/apk/clash/release/app-clash-release.apk "$APK_CLASH"
          for f in "$APK" "$APK_CLASH"; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$f" | tee "cert-$f.txt"
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_CLASH=$APK_CLASH" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CERT=$(grep -m1 "certificate SHA-256 digest" "cert-$APK.txt" | sed 's/.*: //')
          {
            echo "WAYD ${VERSION}"
            echo
            echo "Two builds (arm64 phones, Android 10+), same application id and signing key; install either one over the other to switch, keeping your data. Local-only: no data leaves the phone except model downloads you start."
            echo
            echo "- \`${APK}\`: core. Traffic recording, blocking, analysis and consent-gated HTTPS decryption."
            echo "- \`${APK_CLASH}\`: everything in core plus optional Clash (Mihomo) routing and its screens."
            echo
            echo "Signing certificate SHA-256: \`${CERT}\`"
            echo "APK SHA-256: see the \`.sha256\` file next to each APK."
            echo
            echo "HTTPS decryption is included in both builds, off by default, and only starts after you accept the Danger zone consent in Settings."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" "$APK_CLASH" "$APK_CLASH.sha256" --title "WAYD ${VERSION}" --notes-file notes.md --generate-notes
