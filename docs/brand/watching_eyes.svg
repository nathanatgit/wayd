<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Watching eyes</title>
  <desc id="desc">A pair of glossy, white emoji-style eyes looking to the left, with brown pupils and bright reflections.</desc>
  <defs>
    <radialGradient id="eyeWhite" cx="38%" cy="37%" r="72%" fx="33%" fy="27%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.57" stop-color="#fdfdfe"/>
      <stop offset="0.84" stop-color="#f0f0f3"/>
      <stop offset="1" stop-color="#b9bbc1"/>
    </radialGradient>
    <radialGradient id="iris" cx="52%" cy="78%" r="78%" fx="56%" fy="83%">
      <stop offset="0" stop-color="#70421e"/>
      <stop offset="0.52" stop-color="#38251a"/>
      <stop offset="1" stop-color="#1d1714"/>
    </radialGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c7e87" stop-opacity=".22"/>
      <stop offset=".23" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#777a81" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <!-- White eyeballs -->
  <ellipse cx="168" cy="256" rx="91" ry="145" fill="url(#eyeWhite)" stroke="#9b9da3" stroke-opacity=".28" stroke-width="1.7"/>
  <ellipse cx="344" cy="256" rx="91" ry="145" fill="url(#eyeWhite)" stroke="#9b9da3" stroke-opacity=".28" stroke-width="1.7"/>
  <ellipse cx="168" cy="256" rx="91" ry="145" fill="url(#sideShade)"/>
  <ellipse cx="344" cy="256" rx="91" ry="145" fill="url(#sideShade)"/>
  <!-- The gaze is deliberately offset to the left -->
  <ellipse cx="126" cy="274" rx="48" ry="62" fill="url(#iris)"/>
  <ellipse cx="302" cy="274" rx="48" ry="62" fill="url(#iris)"/>
  <!-- Catchlights -->
  <ellipse cx="107" cy="244" rx="14" ry="17" fill="#ffffff"/>
  <ellipse cx="283" cy="244" rx="14" ry="17" fill="#ffffff"/>
</svg>
