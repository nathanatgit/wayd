<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1254" height="1254" viewBox="0 0 1254 1254" role="img"
     aria-labelledby="title description">
  <title id="title">WAYD hugging face holding a knife</title>
  <desc id="description">A circular, smiling Fluent-inspired hugging emoji holding a lavender kitchen knife. All artwork consists of editable SVG vector shapes and gradients.</desc>
  <defs>
    <radialGradient id="faceYellow" gradientUnits="userSpaceOnUse" cx="747" cy="360" r="805">
      <stop offset="0" stop-color="#FFE982"/>
      <stop offset=".35" stop-color="#FFDB6B"/>
      <stop offset=".67" stop-color="#FFB34A"/>
      <stop offset=".87" stop-color="#FA975C"/>
      <stop offset="1" stop-color="#F47782"/>
    </radialGradient>
    <radialGradient id="facePink" gradientUnits="userSpaceOnUse" cx="519" cy="1014" r="490">
      <stop offset="0" stop-color="#E95F96" stop-opacity=".97"/>
      <stop offset=".43" stop-color="#F0718A" stop-opacity=".39"/>
      <stop offset=".95" stop-color="#FCA56D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F57D80" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F57D80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleSmile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#563448"/>
      <stop offset=".5" stop-color="#3B263E"/>
      <stop offset="1" stop-color="#62415E"/>
    </linearGradient>
    <radialGradient id="handGold" gradientUnits="userSpaceOnUse" cx="315" cy="756" r="335">
      <stop offset="0" stop-color="#FFE36B"/>
      <stop offset=".47" stop-color="#FFD257"/>
      <stop offset=".78" stop-color="#FFBA49"/>
      <stop offset="1" stop-color="#ED8F4D"/>
    </radialGradient>
    <radialGradient id="fingerGold" gradientUnits="userSpaceOnUse" cx="365" cy="725" r="355">
      <stop offset="0" stop-color="#FFE171"/>
      <stop offset=".64" stop-color="#FFC94E"/>
      <stop offset="1" stop-color="#F4A447"/>
    </radialGradient>
    <radialGradient id="rightGold" gradientUnits="userSpaceOnUse" cx="800" cy="749" r="270">
      <stop offset="0" stop-color="#FFE26E"/>
      <stop offset=".56" stop-color="#FFCE53"/>
      <stop offset=".88" stop-color="#F5B148"/>
      <stop offset="1" stop-color="#E78A4B"/>
    </radialGradient>
    <radialGradient id="rightFingerGold" gradientUnits="userSpaceOnUse" cx="821" cy="765" r="290">
      <stop offset="0" stop-color="#FFE06B"/>
      <stop offset=".55" stop-color="#FFD057"/>
      <stop offset=".88" stop-color="#F8BB4B"/>
      <stop offset="1" stop-color="#EDA04B"/>
    </radialGradient>
    <linearGradient id="curledFingers" x1="12%" y1="0%" x2="62%" y2="100%">
      <stop offset="0" stop-color="#FFE77C"/>
      <stop offset=".28" stop-color="#FFE071"/>
      <stop offset=".62" stop-color="#FFD164"/>
      <stop offset=".86" stop-color="#F9BF59"/>
      <stop offset="1" stop-color="#F1AC52"/>
    </linearGradient>
    <linearGradient id="leftFingers3D" x1="10%" y1="0%" x2="55%" y2="100%">
      <stop offset="0" stop-color="#FFE474"/>
      <stop offset=".42" stop-color="#FFDA69"/>
      <stop offset=".80" stop-color="#FFD065"/>
      <stop offset="1" stop-color="#FEC45B"/>
    </linearGradient>
    <linearGradient id="leftFingerBlend" gradientUnits="userSpaceOnUse" x1="190" y1="0" x2="340" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="1"/>
      <stop offset=".42" stop-color="white" stop-opacity=".96"/>
      <stop offset=".75" stop-color="white" stop-opacity=".16"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="leftFingerFade" maskUnits="userSpaceOnUse" x="90" y="670" width="390" height="410">
      <rect x="90" y="670" width="390" height="410" fill="url(#leftFingerBlend)"/>
    </mask>
    <radialGradient id="unifiedLeftPalm" gradientUnits="userSpaceOnUse" cx="476" cy="295" r="735">
      <stop offset="0" stop-color="#FFE676"/>
      <stop offset=".42" stop-color="#FFD363"/>
      <stop offset=".70" stop-color="#FFBA5B"/>
      <stop offset=".90" stop-color="#F5A065"/>
      <stop offset="1" stop-color="#EC846C"/>
    </radialGradient>
    <linearGradient id="fingerCrease" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0" stop-color="#B76F3D" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#D58845" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F5B95B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thumbGradient" gradientUnits="userSpaceOnUse" x1="796" y1="712" x2="735" y2="843">
      <stop offset="0" stop-color="#FFE175"/>
      <stop offset=".52" stop-color="#FFCB53"/>
      <stop offset="1" stop-color="#F4A447"/>
    </linearGradient>
    <linearGradient id="handlePurple" gradientUnits="userSpaceOnUse" x1="668" y1="1025" x2="844" y2="759">
      <stop offset="0" stop-color="#555BA3"/>
      <stop offset=".30" stop-color="#6566B7"/>
      <stop offset=".67" stop-color="#7776CE"/>
      <stop offset="1" stop-color="#5C62AD"/>
    </linearGradient>
    <linearGradient id="bladeMetal" gradientUnits="userSpaceOnUse" x1="879" y1="668" x2="1178" y2="345">
      <stop offset="0" stop-color="#A99FB9"/>
      <stop offset=".40" stop-color="#B4A9C6"/>
      <stop offset=".75" stop-color="#C7B8D8"/>
      <stop offset="1" stop-color="#E8CFF6"/>
    </linearGradient>
    <linearGradient id="bladeRim" gradientUnits="userSpaceOnUse" x1="1046" y1="703" x2="1165" y2="329">
      <stop offset="0" stop-color="#D4BCE8"/>
      <stop offset=".52" stop-color="#DDC7EF"/>
      <stop offset="1" stop-color="#EAD6F8"/>
    </linearGradient>
    <linearGradient id="bolster" gradientUnits="userSpaceOnUse" x1="804" y1="719" x2="889" y2="770">
      <stop offset="0" stop-color="#CBC2DB"/>
      <stop offset=".52" stop-color="#E8DDEA"/>
      <stop offset="1" stop-color="#9C93B3"/>
    </linearGradient>
    <filter id="softDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dy="5" result="shift"/>
      <feComponentTransfer in="shift" result="shadow">
        <feFuncA type="linear" slope=".23"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lightDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feOffset in="blur" dy="3" result="shift"/>
      <feComponentTransfer in="shift" result="shadow">
        <feFuncA type="linear" slope=".18"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="warmFingerShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="faceClip"><circle cx="538" cy="612" r="406"/></clipPath>
  </defs>

  <!-- This is deliberately a true circle (406 px radius), not an ellipse. -->
  <g id="round-face">
    <circle cx="538" cy="612" r="406" fill="url(#faceYellow)"/>
    <circle cx="538" cy="612" r="406" fill="url(#facePink)"/>
    <g clip-path="url(#faceClip)">
      <ellipse cx="258" cy="614" rx="172" ry="125" fill="url(#cheek)"/>
      <ellipse cx="796" cy="614" rx="172" ry="125" fill="url(#cheek)"/>
    </g>
  </g>

  <g id="closed-eyes-and-smile" fill="none" stroke="url(#purpleSmile)"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#lightDepth)">
    <path d="M 321,482 C 335,403 425,398 464,478" stroke-width="53"/>
    <path d="M 620,480 C 634,402 721,398 765,477" stroke-width="53"/>
    <path d="M 373,592 C 449,717 625,718 710,588" stroke-width="51"/>
  </g>

  <!-- The three finger valleys and the three crease origins share the same
       coordinates. Keeping them joined prevents detached-looking fingers. -->
  <g id="left-hugging-hand" transform="translate(85.1 658.8) scale(.451)">
    <path id="left-hand-silhouette"
          d="M 557,111
             C 607,96 649,116 665,166
             C 697,279 733,397 774,522
             C 806,626 788,705 747,764
             C 695,836 627,860 553,849
             C 502,844 460,823 414,793
             L 61,586
             C 24,558 34,492 77,463
             C 33,435 39,354 78,322
             C 49,283 58,225 113,197
             C 134,181 153,178 177,186
             C 171,132 196,80 236,87
             C 258,91 277,105 302,126
             L 534,327
             Q 549,343 540,350
             C 528,347 520,262 511,188
             C 501,151 523,121 557,111 Z"
          fill="url(#unifiedLeftPalm)"/>
    <!-- Folds grow directly from the finger valleys (177,186), (78,322),
         and (77,463), then taper gently into the palm. -->
    <path d="M 177,186 C 245,219 333,297 452,381
             C 336,318 246,236 177,186 Z"
          fill="url(#fingerCrease)"/>
    <path d="M 78,322 C 138,355 252,435 375,495
             C 268,458 151,375 78,322 Z"
          fill="url(#fingerCrease)"/>
    <path d="M 77,463 C 145,502 231,550 324,592
             C 229,569 142,522 77,463 Z"
          fill="url(#fingerCrease)"/>
  </g>

  <!-- Knife is made of separate blade, bolster, handle and rivet vector shapes. -->
  <g id="knife">
    <path id="knife-handle"
          d="M 819,704 C 801,709 784,742 771,768 L 664,950
             C 645,982 647,1017 674,1039 C 704,1064 748,1062 776,1026
             C 814,976 859,870 900,787 C 923,747 878,696 819,704 Z"
          fill="url(#handlePurple)"/>
    <path d="M 667,993 C 670,1020 691,1048 720,1043 C 744,1040 765,1009 785,976"
          fill="none" stroke="#4D539D" stroke-opacity=".43" stroke-width="8"/>
    <circle cx="716" cy="956" r="16" fill="#FFD050"/>
    <circle cx="759" cy="869" r="16" fill="#FFD050"/>

    <path id="knife-bolster"
          d="M 819,702 L 861,654 L 906,679 L 878,752 L 831,788 L 793,755 Z"
          fill="url(#bolster)"/>
    <path d="M 812,746 L 862,781" stroke="#9E8FB3" stroke-width="4" opacity=".35"/>

    <path id="knife-blade"
          d="M 859,654 C 913,523 994,403 1117,311
             C 1139,294 1151,305 1161,329
             C 1193,418 1093,678 1036,731
             C 1012,752 987,728 967,718
             L 866,690 Z"
          fill="url(#bladeMetal)"/>
    <path id="blade-edge"
          d="M 1117,311 C 1139,294 1151,305 1161,329
             C 1193,418 1093,678 1036,731
             C 1012,752 987,728 967,718
             C 1049,678 1138,439 1117,311 Z"
          fill="url(#bladeRim)" opacity=".85"/>
    <path d="M 1118,313 C 1137,381 1089,568 1039,653" fill="none"
          stroke="#EEE0F7" stroke-opacity=".7" stroke-width="4"/>
    <path d="M 859,654 C 904,668 935,695 967,718" fill="none"
          stroke="#D4C2DE" stroke-width="4" opacity=".8"/>
  </g>

  <!-- The right palm and fingers are drawn above the handle to grip it. -->
  <g id="right-gripping-hand">
    <path id="gripping-thumb"
          d="M 786,712 C 812,697 836,704 844,727
             C 854,752 835,774 809,786
             C 769,803 740,817 718,847
             C 701,829 708,792 721,765
             C 737,739 762,721 786,712 Z"
          fill="url(#thumbGradient)"/>
    <g fill="none" stroke-linecap="round">
      <!-- Each curled finger is independent; the purple handle stays visible between them. -->
      <path d="M 842,769 C 873,775 912,792 931,810" stroke="url(#curledFingers)" stroke-width="70"/>
      <path d="M 803,823 C 844,834 892,850 919,870" stroke="url(#curledFingers)" stroke-width="71"/>
      <path d="M 786,885 C 823,898 864,917 893,936" stroke="url(#curledFingers)" stroke-width="69"/>
      <path d="M 779,944 C 811,960 840,977 872,980" stroke="url(#curledFingers)" stroke-width="64"/>
    </g>
  </g>
</svg>
